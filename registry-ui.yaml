apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-ui
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-ui
  template:
    metadata:
      labels:
        app: registry-ui
    spec:
      containers:
      - name: registry-ui
        image: joxit/docker-registry-ui:main
        env:
        - name: REGISTRY_TITLE
          value: "FollowupFinder Registry"
        - name: REGISTRY_URL
          value: "http://followupfinder-registry:5000"
        - name: DELETE_IMAGES
          value: "true"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: registry-ui
  namespace: jenkins
spec:
  selector:
    app: registry-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
