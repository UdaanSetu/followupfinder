apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: followupfinder-ai
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/UdaanSetu/followupfinder.git
    targetRevision: feature/backend
    path: deployment/helm/followupfinder-ai

  destination:
    server: https://kubernetes.default.svc
    namespace: followupfinder

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

